<style>
:root{
  --navy:#223767; --red:#e31d24;
  --bg:#eef0f6; --surface:#ffffff; --surface2:#e3e7f0; --fg:#18223d; --muted:#5d6885; --line:#d3d9e6;
  --accent:#223767; --accent-fg:#ffffff; --accent-soft:#e0e6f4;
  --ok:#1b7a4b; --ok-soft:#d8f0e3; --warn:#9c6500; --warn-soft:#fbefcf; --bad:#c4202a; --bad-soft:#fbe0e1;
  --info:#2d5fa3; --info-soft:#dbe6f8; --vio:#6d45a8; --vio-soft:#e8defa; --gray:#7b839a; --gray-soft:#e4e7ef;
  --pink:#b03a8a; --teal:#16837f; --orange:#c2570c;
  --shadow:0 1px 2px rgba(24,34,61,.12); --shadow2:0 8px 24px rgba(24,34,61,.28);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1630; --surface:#18233f; --surface2:#202d4e; --fg:#e9ecf5; --muted:#9aa6c4; --line:#2c3a5e;
  --accent:#9db3ee; --accent-fg:#0e1630; --accent-soft:#223056;
  --ok:#5fcf93; --ok-soft:#1c3a2c; --warn:#e6b84d; --warn-soft:#3b3015; --bad:#f58a8f; --bad-soft:#4a1f27;
  --info:#8db6f2; --info-soft:#1d3257; --vio:#b79af0; --vio-soft:#2f2850; --gray:#8e99b6; --gray-soft:#27335a;
  --pink:#e58bcb; --teal:#5ed0cb; --orange:#f0a15c;
  --shadow:none; --shadow2:0 8px 24px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1630; --surface:#18233f; --surface2:#202d4e; --fg:#e9ecf5; --muted:#9aa6c4; --line:#2c3a5e;
  --accent:#9db3ee; --accent-fg:#0e1630; --accent-soft:#223056;
  --ok:#5fcf93; --ok-soft:#1c3a2c; --warn:#e6b84d; --warn-soft:#3b3015; --bad:#f58a8f; --bad-soft:#4a1f27;
  --info:#8db6f2; --info-soft:#1d3257; --vio:#b79af0; --vio-soft:#2f2850; --gray:#8e99b6; --gray-soft:#27335a;
  --pink:#e58bcb; --teal:#5ed0cb; --orange:#f0a15c;
  --shadow:none; --shadow2:0 8px 24px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.45 "Montserrat","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{width:100%;max-width:1900px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.topbar{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px);flex:none}
.topbar header{padding-block:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:24px;width:auto;display:block}
.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#aab6d6;font-weight:600;border-left:1px solid rgba(255,255,255,.28);padding-left:12px}
.topbar .stat{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);box-shadow:none;color:#fff}
.topbar .stat span{color:#b4bfdc}
.topbar .stat.goal b{color:#7fe3ac}
.topbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.32);box-shadow:none}
.topbar .btn:hover{background:rgba(255,255,255,.14)}
.topbar .seg2{background:rgba(255,255,255,.12)}
.topbar .seg2 button{color:#c9d2ea}
.topbar .seg2 button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:none}
.topbar .btn:focus-visible,.topbar button:focus-visible{outline-color:#fff}
.progress{height:4px;background:rgba(255,255,255,.16);overflow:hidden}
.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.app{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding-block:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 10px;display:flex;flex-direction:column;line-height:1.2;box-shadow:var(--shadow)}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat.goal b{color:var(--ok)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:14px;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:inline-block}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg2{display:inline-flex;background:var(--surface2);padding:3px;border-radius:10px;gap:2px}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:6px 14px;font-size:14px;color:var(--muted)}
.seg2 button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=text],input[type=datetime-local],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.toolbar input[type=search]{flex:1 1 220px;max-width:360px}
.toolbar select{flex:0 1 200px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
/* BOARD */
.board{flex:1;min-height:0;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;scroll-snap-type:x proximity}
.col{flex:1 0 250px;max-width:330px;min-width:250px;display:flex;flex-direction:column;background:var(--surface2);border-radius:14px;min-height:0;scroll-snap-align:start;border:2px solid transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.colh{padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px}
.colh .top{display:flex;align-items:baseline;gap:8px}
.colh h2{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.colh .n{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.colh .bar{height:4px;border-radius:3px;background:var(--stc)}
.colh .sub{font-size:12px;color:var(--muted);min-height:16px}
.cards{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:8px}
.tile{background:var(--surface);border-radius:10px;padding:8px 10px 8px 12px;box-shadow:var(--shadow);cursor:pointer;border-left:4px solid var(--sgc,var(--gray));display:flex;flex-direction:column;gap:3px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative}
.tile:hover{box-shadow:0 2px 8px rgba(20,30,25,.18)}
.tile .tn{font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tile .tp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .tm{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--gray-soft);color:var(--muted);white-space:nowrap}
.chip.sg{background:var(--sgs,var(--gray-soft));color:var(--sgc,var(--muted));font-weight:600}
.chip.studied{background:var(--info-soft);color:var(--info)}
.chip.cb{background:var(--info-soft);color:var(--info)}
.chip.late{background:var(--bad-soft);color:var(--bad);font-weight:600}
.chip.att{background:var(--warn-soft);color:var(--warn)}
.tile .tnote{font-size:12px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tile.dragging{opacity:.35}
.dragghost{position:fixed;z-index:50;pointer-events:none;box-shadow:var(--shadow2);transform:rotate(2deg);opacity:.96}
body.dragging{cursor:grabbing}
body.dragging *{cursor:grabbing!important}
.colempty{color:var(--muted);font-size:13px;text-align:center;padding:18px 6px}
.morebtn{align-self:center}
.s1{--sgc:var(--ok);--sgs:var(--ok-soft)} .s2{--sgc:var(--info);--sgs:var(--info-soft)} .s3{--sgc:var(--vio);--sgs:var(--vio-soft)}
.s4{--sgc:var(--bad);--sgs:var(--bad-soft)} .s5{--sgc:var(--gray);--sgs:var(--gray-soft)} .s6{--sgc:var(--gray);--sgs:var(--gray-soft)}
.st-new{--stc:var(--gray)} .st-noanswer{--stc:var(--warn)} .st-callback{--stc:var(--info)} .st-thinking{--stc:var(--vio)}
.st-booked{--stc:var(--ok)} .st-refused{--stc:var(--bad)} .st-wrong{--stc:var(--gray)}
/* CALL MODE */
.callview{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:0;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:10px;margin:10px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 4px;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.tabs .n{font-variant-numeric:tabular-nums;font-weight:400}
.list{overflow:auto;flex:1;min-height:0}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.item:hover{background:var(--surface2)}
.item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--stc,var(--line));grid-row:1/3}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ph{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;grid-column:2}
.item .tg{grid-row:1/3;grid-column:3;font-size:11.5px;text-align:right;color:var(--muted);max-width:110px}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.more{padding:10px;text-align:center}
/* CARD */
.card{overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.back{display:none}
.chead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;justify-content:space-between}
.chead h2{margin:0;font-size:21px;font-weight:700;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.sg{background:var(--sgs);color:var(--sgc);border-color:transparent;font-weight:600}
.badge.studied{background:var(--info-soft);color:var(--info);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.stage{background:var(--stc);color:var(--surface);border-color:transparent;font-weight:600}
.phone{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.phone .num{font-size:24px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.script{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.script h3,.sec h3,.result h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.script p{margin:0;white-space:pre-wrap}
.sec{display:flex;flex-direction:column;gap:8px}
.rec{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.rec .rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600;margin-bottom:4px}
.rec .rh a{font-weight:400;font-size:13px;color:var(--info)}
.rec dl{margin:0;display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:3px 10px;font-size:14px}
.rec dt{color:var(--muted)} .rec dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.result{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px}
.rb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 8px;font-weight:600;font-size:14px}
.rb:hover{filter:brightness(.96)}
.rb.booked{background:var(--ok-soft);color:var(--ok)} .rb.noanswer{background:var(--warn-soft);color:var(--warn)}
.rb.callback{background:var(--info-soft);color:var(--info)} .rb.thinking{background:var(--vio-soft);color:var(--vio)}
.rb.refused,.rb.wrong{background:var(--bad-soft);color:var(--bad)}
textarea{width:100%;min-height:44px;resize:vertical}
.cbbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--info-soft);padding:10px;border-radius:10px}
.cbbox label{font-size:13px;color:var(--info)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .h{font-size:13.5px;border-left:3px solid var(--line);padding:2px 0 2px 10px}
.hist .h b{font-weight:600}
.hist .h time{color:var(--muted);margin-right:6px}
.hist .h.mv{color:var(--muted)}
.cur{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--surface2)}
.hint{font-size:12.5px;color:var(--muted)}
/* DRAWER */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--surface);z-index:21;box-shadow:var(--shadow2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
@media (max-width:820px){
  .callview{grid-template-columns:1fr}
  .app[data-view="list"] .cardpanel{display:none}
  .app[data-view="card"] .listpanel{display:none}
  .back{display:inline-block}
  .card{padding:12px}
  .phone .num{font-size:22px}
  .stat{padding:3px 6px;min-width:0}
  .stat b{font-size:15px}
  .stat span{font-size:10px;letter-spacing:.02em}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);flex:1 1 100%;gap:5px;order:3}
  .tools .btn{padding:5px 9px;font-size:13px;white-space:nowrap}
  .brand span{display:none}
  .tools{flex-wrap:nowrap;overflow-x:auto;flex:1 1 100%;order:4;padding-bottom:2px}
  .col{flex-basis:84vw;min-width:84vw}
  .toolbar select{flex:1 1 40%}
  .count{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- v4: editable CRM ---- */
.rb{background:color-mix(in srgb,var(--stc,var(--gray)) 15%,var(--surface));color:var(--stc,var(--fg));border-color:color-mix(in srgb,var(--stc,var(--gray)) 35%,var(--line))}
.badge.stage{background:var(--stc);color:var(--surface);border:0;cursor:pointer;font-family:inherit}
.badge.stage:hover{filter:brightness(1.1)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.menu{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow2);padding:4px;display:flex;flex-direction:column;min-width:190px;margin-top:4px}
.menu .mi{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:7px;display:flex;align-items:center;gap:8px}
.menu .mi::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--stc)}
.menu .mi:hover{background:var(--surface2)} .menu .mi.cur{font-weight:700}
details.sec{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:block;padding:0}
details.sec>summary{cursor:pointer;padding:9px 12px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
.cnt{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700}
.sbody{padding:2px 12px 12px;display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .td{font-size:12.5px;color:var(--muted)} .task .td.late,.trow .due.late{color:var(--bad);font-weight:700}
.task input[type=checkbox],.trow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.cbbox{grid-column:1/-1}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addrow input[type=text]{flex:1 1 160px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.fld.inline{flex-direction:row;align-items:center;gap:8px}
.fld.inline select{flex:1}
.fld input,.fld select,.fld textarea{color:var(--fg);font-size:14px}
.cmt{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cmt .ch{font-size:13px}.cmt .ch time{color:var(--muted)}
.cmt .ctx{white-space:pre-wrap;overflow-wrap:anywhere;margin:3px 0 5px}
.cmt .cb{display:flex;gap:6px}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--fg)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.35;cursor:default}
.hist .by{color:var(--muted);font-size:12px}
.hist .h{border-left-color:var(--stc,var(--line))}
.chip.money{background:var(--ok-soft);color:var(--ok);font-weight:600}
.chip.stg{background:color-mix(in srgb,var(--stc) 16%,var(--surface));color:var(--stc);font-weight:600}
.col.addcol{flex:0 0 120px;min-width:120px;align-self:flex-start;border:2px dashed var(--line);background:transparent;color:var(--muted);padding:14px 8px;font-weight:600;cursor:pointer;min-height:0}
.col.addcol:hover{border-color:var(--accent);color:var(--accent)}
.tasksview{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;max-width:900px;width:100%}
.tgh{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;gap:8px;align-items:center}
.tgh.late{color:var(--bad)}
.trow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.trow .tx{font-weight:600}
.trow .due{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--info);text-align:left;font-size:13px;text-decoration:underline;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,16,35,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow:auto}
.mbox{background:var(--surface);border-radius:16px;box-shadow:var(--shadow2);width:min(640px,100%);display:flex;flex-direction:column;margin-block:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-size:18px}
.mbody{padding:14px 18px 18px}
.form{display:flex;flex-direction:column;gap:10px}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mh{margin:12px 0 0;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stlist{display:flex;flex-direction:column;gap:8px}
.strow{border:1px solid var(--line);border-left:5px solid var(--stc);border-radius:10px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.sttop{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sttop input[type=text]{flex:1 1 140px}
.swatch{width:14px;height:14px;border-radius:50%;background:var(--stc);flex:none}
.flags{display:flex;gap:4px 14px;flex-wrap:wrap}
.chk2{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.days{width:58px;padding:3px 6px!important}
@media (max-width:820px){
  .drawer{width:100vw}
  .task{grid-template-columns:auto 1fr auto}
  .task .btn:nth-of-type(1){grid-column:2}
  .trow{grid-template-columns:auto 1fr auto}
  .trow .stg{display:none}
  .toolbar .btn{flex:1 1 auto}
}

.listbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg3{display:inline-flex;background:var(--surface);border:1px solid var(--line);padding:3px;border-radius:12px;gap:3px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto}
.seg3 button{border:0;background:transparent;border-radius:9px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg3 button .n{font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums;opacity:.8}
.seg3 button[aria-selected="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg3 button[aria-selected="true"]{background:#2d4a9a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg3 button[aria-selected="true"]{background:#2d4a9a}}
.chip.ot{background:var(--warn-soft);color:var(--warn)}
</style>
</head>

/* queue logic */
function inQueue(c){
  if(!c.p)return false;var st=ST(stageOf(c));if(st.final)return false;
  var cb=cbOf(c);if(cb)return cb<=endOfToday();
  if(st.init)return true;
  if(st.tries)return attempts(c)<CFG.max&&!noAnswerToday(c);
  return !!st.ask;
}
function isScheduled(c){var st=ST(stageOf(c));if(st.final)return false;var cb=cbOf(c);return !!cb&&cb>endOfToday()}
function isDone(c){var st=ST(stageOf(c));return !!st.final||(st.tries&&attempts(c)>=CFG.max)}
function queueSort(a,b){
  var ca=cbOf(a),cb=cbOf(b);
  if(!!ca!==!!cb)return ca?-1:1;
  if(ca&&cb&&ca!==cb)return ca-cb;
  if(a.sg!==b.sg)return a.sg-b.sg;
  var x=attempts(a),y=attempts(b);if(x!==y)return x-y;
  return a._i-b._i;
}

var drag=null,suppress=false;
function startDrag(){
  if(!drag||drag.active)return;drag.active=true;
  var r=drag.el.getBoundingClientRect();drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;
  var g=drag.el.cloneNode(true);g.className+=' dragghost';g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('dragging');document.body.classList.add('dragging');
  drag.iv=setInterval(edgeScroll,16);
}
function edgeScroll(){
  if(!drag||!drag.active)return;var b=$('board'),r=b.getBoundingClientRect();
  if(drag.x<r.left+60)b.scrollLeft-=16;else if(drag.x>r.right-60)b.scrollLeft+=16;
  var col=colAt(drag.x,drag.y);if(col){var cs=col.querySelector('.cards');if(cs){var cr=cs.getBoundingClientRect();
    if(drag.y<cr.top+40)cs.scrollTop-=12;else if(drag.y>cr.bottom-40)cs.scrollTop+=12}}
}

function endDrag(drop){
  if(!drag)return;clearTimeout(drag.timer);
  var d=drag;drag=null;
  if(d.active){
    clearInterval(d.iv);if(d.ghost)d.ghost.remove();d.el.classList.remove('dragging');document.body.classList.remove('dragging');
    Array.prototype.forEach.call(document.querySelectorAll('.col.over'),function(x){x.classList.remove('over')});

  return out;
}
function renderList(){
  var list=$('list');list.textContent='';var v=callVisible();
  if(!v.length){list.appendChild(el('div','empty',view.tab==='queue'&&!view.q&&!view.nophone?'Очередь пуста — все обзвонены на сегодня.':'Ничего не найдено.'));return}
  v.slice(0,view.limit).forEach(function(c){
    var st=ST(stageOf(c));var it=el('div','item');it.style.setProperty('--stc',stc(st));it.setAttribute('role','listitem');it.tabIndex=0;
    if(view.cur===c.id)it.setAttribute('aria-current','true');
    it.appendChild(el('span','dot'));it.appendChild(el('div','nm',c.n));
    var tag=catOf(c),cb=cbOf(c);if(cb)tag='↻ '+fmt(cb);else if(!st.init)tag=st.name;
    it.appendChild(el('div','tg',tag));it.appendChild(el('div','ph',c.p?fmtPhone(c):'нет номера'));
    it.onclick=function(){openCall(c.id)};
    it.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openCall(c.id)}};
    list.appendChild(it)});
  if(v.length>view.limit){var m=el('div','more');var b=el('button','btn','Показать ещё ('+(v.length-view.limit)+')');b.onclick=function(){view.limit+=200;renderList()};m.appendChild(b);list.appendChild(m)}
}
function openCall(id){view.cur=id;$('app').dataset.view='card';$('card').scrollTop=0;render(true)}
function next(){
  var v=CARDS.filter(function(x){return inQueue(x)&&base(x)&&x.id!==view.cur}).sort(queueSort);
  if(!v.length){toast('В очереди больше никого');return}
  view.tab='queue';openCall(v[0].id);
}
/* ---------- tasks mode ---------- */
function allTasks(){
  var out=[];CARDS.forEach(function(c){if(!matches(c))return;openTasks(c).forEach(function(t){out.push({c:c,t:t})})});
  out.sort(function(a,b){return a.t.due-b.t.due});return out;
}
function dueCount(){var n=0,e=endOfToday();CARDS.forEach(function(c){openTasks(c).forEach(function(t){if(t.due<=e)n++})});return n}
function renderTasks(){
  var box=$('tasksview');box.textContent='';
  var all=allTasks(),now=Date.now(),eod=endOfToday();
  var groups=[['Просрочено',all.filter(function(x){return x.t.due<now}),'late'],['Сегодня',all.filter(function(x){return x.t.due>=now&&x.t.due<=eod}),''],['Позже',all.filter(function(x){return x.t.due>eod}),'']];
  var any=false;
  groups.forEach(function(g){
    if(!g[1].length)return;any=true;
    var sec2=el('section','tgroup');var hh=el('h2','tgh '+g[2],g[0]);hh.appendChild(el('span','cnt',String(g[1].length)));sec2.appendChild(hh);
    g[1].forEach(function(x){
      var r=el('div','trow');var cb=el('input');cb.type='checkbox';cb.setAttribute('aria-label','Выполнено');
      cb.onchange=function(){x.t.done=Date.now();save();render(true)};r.appendChild(cb);
      var m=el('div','tmain');m.appendChild(el('div','tx',x.t.text));
      var nm=el('button','linkbtn',x.c.n+(x.c.p?' · '+fmtPhone(x.c):''));nm.onclick=function(){openDrawer(x.c.id)};m.appendChild(nm);r.appendChild(m);
      var st=ST(stageOf(x.c));var chip=el('span','chip stg',st.name);chip.style.setProperty('--stc',stc(st));r.appendChild(chip);
      r.appendChild(el('div','due'+(x.t.due<now?' late':''),fmt(x.t.due)));
      sec2.appendChild(r)});
    box.appendChild(sec2)});
  if(!any)box.appendChild(el('div','empty','Открытых задач нет. Задачи появляются, когда вы ставите «Перезвонить» или добавляете их в карточке клиента.'));
}
/* ---------- stats / chrome ---------- */
function renderStats(){
  var k=dayKey(Date.now()),calls=0,ans=0,book=0,touched=0,total=0;
  CARDS.forEach(function(c){
    if(!c.p)return;total++;var s=S[c.id];if(!s||!s.calls.length)return;touched++;
    s.calls.forEach(function(x){if(dayKey(x.t)!==k)return;var st=ST(x.r);
      if(!x.mv){calls++;if(!st.tries&&!(st.final&&!st.win&&!st.lost))ans++}
      if(st.win)book++});
  });
  var b=$('stats');b.textContent='';
  [['Звонков сегодня',calls],['Дозвонов',ans],['Записей',book,'goal'],['В работе',touched+' / '+total]].forEach(function(x){
    var d=el('div','stat'+(x[2]?' '+x[2]:''));d.appendChild(el('b','',String(x[1])));d.appendChild(el('span','',x[0]));b.appendChild(d)});
  $('bar').style.width=(total?Math.round(touched*100/total):0)+'%';
}
function renderModes(){
  var box=$('modes');box.textContent='';var dc=dueCount();
  [['board','Воронка'],['call','Обзвон списком'],['tasks','Задачи'+(dc?' ('+dc+')':'')]].forEach(function(m){
    var b=el('button','',m[1]);b.setAttribute('role','tab');b.setAttribute('aria-selected',String(view.mode===m[0]));
    b.onclick=function(){view.mode=m[0];try{store&&store.setItem(KEY+'_mode',m[0])}catch(e){}
      if(m[0]==='call'&&!view.cur){var f=CARDS.filter(function(x){return inQueue(x)&&base(x)}).sort(queueSort)[0];if(f)view.cur=f.id}
      $('app').dataset.view='list';render()};
    box.appendChild(b)});
}
function render(keep){
  renderLists();renderModes();renderStats();
  var m=view.mode;
  $('board').hidden=m!=='board';$('callview').hidden=m!=='call';$('tasksview').hidden=m!=='tasks';$('shown').hidden=m!=='board';
  if(m==='board')renderBoard();
  else if(m==='call'){renderTabs();var sc=$('list').scrollTop;renderList();if(keep)$('list').scrollTop=sc;renderCardInto($('card'),view.cur?IDX[view.cur]:null,'call')}
  else renderTasks();
  if(view.drawer)renderCardInto($('dcard'),IDX[view.drawer],'drawer');
}
function inList(c){return view.list==='all'||c.ls===view.list}
function buildFilters(){
  var sg=$('fSeg'),cur=view.seg;sg.textContent='';sg.appendChild(new Option('Все категории',''));
  var cc={},ord={};CARDS.forEach(function(c){if(!inList(c))return;var k=catOf(c);cc[k]=(cc[k]||0)+1;if(ord[k]==null||c.sg<ord[k])ord[k]=c.sg});
  Object.keys(cc).sort(function(a,b){return ord[a]-ord[b]||cc[b]-cc[a]}).forEach(function(k){sg.appendChild(new Option(k+' ('+cc[k]+')',k))});
  if(cc[cur])sg.value=cur;else{view.seg='';sg.value=''}
  var lc={};CARDS.forEach(function(c){if(!inList(c))return;c.lg.forEach(function(l){lc[l]=(lc[l]||0)+1})});
  var lg=$('fLang'),cl=view.lang;lg.textContent='';lg.appendChild(new Option('Все языки',''));
  Object.keys(lc).sort(function(a,b){return lc[b]-lc[a]}).forEach(function(l){lg.appendChild(new Option(l+' ('+lc[l]+')',l))});
  if(lc[cl])lg.value=cl;else{view.lang='';lg.value=''}
}
function listCount(k){return CARDS.filter(function(c){return k==='all'||c.ls===k}).length}
function renderLists(){
  var box=$('lists');box.textContent='';
  [['u','Ушедшие клиенты'],['l','Лиды'],['all','Все']].forEach(function(x){
    var b=el('button','',x[1]+' ');b.setAttribute('role','tab');b.setAttribute('aria-selected',String(view.list===x[0]));
    b.appendChild(el('span','n',String(listCount(x[0]))));b.onclick=function(){setList(x[0])};box.appendChild(b)});
}
function setList(k){
  view.list=k;view.seg='';view.lang='';view.limit=80;view.lim={};view.cur=null;
  try{store&&store.setItem(KEY+'_list',k)}catch(e){}
  buildFilters();render();
}
buildFilters();
$('fSeg').onchange=function(){view.seg=this.value;view.limit=80;view.lim={};render()};
$('fLang').onchange=function(){view.lang=this.value;view.limit=80;view.lim={};render()};
var qt;$('q').oninput=function(e){var v=e.target.value.trim();clearTimeout(qt);qt=setTimeout(function(){view.q=v;view.limit=80;view.lim={};render()},180)};
$('fNoPhone').onchange=function(e){view.nophone=e.target.checked;view.limit=80;view.lim={};render()};
$('bAdd').onclick=addClient;$('bSettings').onclick=openSettings;
$('bTheme').onclick=function(){
  var r=document.documentElement,cur=r.getAttribute('data-theme');
  var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme',dark?'light':'dark');try{store&&store.setItem(KEY+'_theme',dark?'light':'dark')}catch(e){}
};
try{var th=store&&store.getItem(KEY+'_theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
function download(name,mime,text){
  var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500);
}
$('bBackup').onclick=function(){var d=new Date();download('obzvon-backup-'+dayKey(d.getTime())+'.json','application/json',JSON.stringify({v:2,saved:d.toISOString(),data:S,cfg:CFG}));toast('Резервная копия скачана')};
$('bRestore').onclick=function(){$('fRestore').click()};
$('fRestore').onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result);if(!j||!j.data)throw 0;
    if(j.cfg){
      if(j.cfg.stages&&j.cfg.stages.length){CFG.stages=j.cfg.stages;CFG.stages[0].init=1;indexStages()}
      if(j.cfg.mgr!=null)CFG.mgr=j.cfg.mgr;if(j.cfg.max)CFG.max=j.cfg.max;
      (j.cfg.custom||[]).forEach(function(m){if(!CFG.custom.some(function(x){return x.id===m.id})){CFG.custom.push(m);CARDS.push(customCard(m))}});
      saveCfg();
    }
    var n=0;
    Object.keys(j.data).forEach(function(k){
      var b=j.data[k];if(!b.tasks){b.tasks=[];if(b.cb)b.tasks.push({id:uid(),due:b.cb,text:'Перезвонить',auto:1,done:0});delete b.cb}
      var a=S[k];var score=function(x){return ((x.calls||[]).length)+((x.comments||[]).length)+((x.tasks||[]).length)};
      if(!a||score(b)>=score(a)){S[k]=b;n++}});
    reindex();save();buildFilters();render();toast('Восстановлено карточек: '+n)}catch(x){toast('Файл не похож на резервную копию')}};
  r.readAsText(f);e.target.value='';
};
function csvCell(v){v=String(v==null?'':v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$('bCsv').onclick=function(){
  var rows=[['Телефон','Имя','Сегмент','Язык','Этап воронки','Попыток недозвона','Последнее действие','Ближайшая задача','Интерес','Пробный урок','Сумма','Причина отказа','Комментарии','История']];
  CARDS.forEach(function(c){var s=S[c.id];if(!s)return;var l=lastCall(c);
    if(!(s.calls&&s.calls.length)&&!(s.comments&&s.comments.length)&&!(s.tasks&&s.tasks.length)&&!s.deal)return;
    var d=dealOf(c),reason='';(s.calls||[]).forEach(function(x){if(x.reason)reason=x.reason});
    rows.push([c.p?fmtPhone(c):'',c.n,(c.ls==='u'?'Ушедшие: ':'Лиды: ')+catOf(c),c.lg.join(', '),ST(stageOf(c)).name,attempts(c),l?fmt(l.t):'',cbOf(c)?fmt(cbOf(c)):'',d.interest||'',d.trial?fmt(new Date(d.trial).getTime()):'',d.amount||'',reason,
      (s.comments||[]).map(function(m){return fmt(m.t)+(m.by?' '+m.by:'')+': '+m.text}).join(' | '),
      (s.calls||[]).map(function(x){return fmt(x.t)+' '+(x.mv?'→ ':'')+ST(x.r).name+(x.n?': '+x.n:'')}).join(' | ')])});
  if(rows.length===1){toast('Пока нет ни одного действия');return}
  download('obzvon-itogi-'+dayKey(Date.now())+'.csv','text/csv;charset=utf-8','﻿'+rows.map(function(r){return r.map(csvCell).join(';')}).join('\r\n'));
};
render();
window.__crm={S:S,CFG:CFG,get CARDS(){return CARDS},view:view,render:render,moveTo:moveTo,openDrawer:openDrawer,stageOf:stageOf};
})();

<script>
(function(){
var enc=JSON.parse(document.getElementById('enc').textContent);
function b2u(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var LK='lingualand_crm_key';
function err(m){var e=document.getElementById('lerr');e.textContent=m;e.hidden=!m}
async function gunzip(buf){
  var ds=new DecompressionStream('gzip');var w=ds.writable.getWriter();w.write(buf);w.close();
  return new Response(ds.readable).text();
}
async function open(keyBytes,remember){
  var key=await crypto.subtle.importKey('raw',keyBytes,'AES-GCM',false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(enc.i)},key,b2u(enc.c));
  window.__DATA=await gunzip(plain);
  if(remember){try{localStorage.setItem(LK,u2b(keyBytes))}catch(e){}}
  var s=document.createElement('script');s.textContent=document.getElementById('appsrc').textContent;document.body.appendChild(s);
  document.getElementById('lock').remove();
}
async function derive(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b2u(enc.s),iterations:enc.n,hash:'SHA-256'},km,256);
  return new Uint8Array(bits);
}
if(!window.crypto||!crypto.subtle||typeof DecompressionStream==='undefined'){err('Этот браузер слишком старый. Откройте сайт в свежем Chrome, Safari или Edge.')}
document.getElementById('lockform').addEventListener('submit',async function(e){
  e.preventDefault();err('');var btn=document.getElementById('lbtn');btn.disabled=true;btn.textContent='Проверяю…';
  try{var kb=await derive(document.getElementById('lpw').value);await open(kb,document.getElementById('lrem').checked)}
  catch(x){err('Неверный пароль. Попробуйте ещё раз.');btn.disabled=false;btn.textContent='Войти'}
});
(async function(){
  var k=null;try{k=localStorage.getItem(LK)}catch(e){}
  if(k){try{await open(b2u(k),false)}catch(x){try{localStorage.removeItem(LK)}catch(e){}}}
})();
})();

</script>
